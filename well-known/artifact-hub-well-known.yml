  apis.yml as a result. The provider does publish a vulnerability-reporting process, but it
  lives in SECURITY.md and SECURITY-INSIGHTS.yml in the GitHub repository, not at
  /.well-known/security.txt — see security/artifact-hub-vulnerability-disclosure.yml.
