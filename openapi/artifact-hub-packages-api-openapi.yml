                  values:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /packages/{packageID}/views:
    get:
      tags:
      - Packages
      summary: Get the views of the package provided
      description: Get the views of the package provided
      operationId: getPackageViews
      parameters:
      - $ref: '#/components/parameters/PackageIDParam'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                example:
                  1.0.1:
                    '2021-12-09': 12
                    '2021-12-08': 30
                  1.0.0:
                    '2021-12-09': 2
                    '2021-12-08': 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    OperatorsParam:
      in: query
      name: operators
      schema:
        type: boolean
      required: false
      description: Whether to get only operators
    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        default: 20
        maximum: 60
      required: false
      description: The number of items to return
    VersionParam:
      in: path
      name: version
      schema:
        type: string
        example: 1.0.0
      required: true
      description: Package version
    LicensesListParam:
      in: query
      name: license
      schema:
        type: array
        items:
          type: string
        example:
        - MIT
        - Apache-2.0
      required: false
      description: List of SPDX identifiers
    OrgsListParam:
      in: query
      name: org
      schema:
        type: array
        items:
          type: string
        example:
        - org1
        - org2
      required: false
      description: List of organization names
    FacetsParam:
      in: query
      name: facets
      schema:
        type: boolean
        default: false
      required: true
      description: Whether we should get facets or not
    PackageNameParam:
      in: path
      name: packageName
      schema:
        type: string
        example: pkg1
      required: true
      description: Package name
    SortParam:
      in: query
      name: sort
      schema:
        type: string
        enum:
        - relevance
        - stars
        - last_updated
        example: relevance
      required: false
      description: Sort criteria
    OrgNameParam:
      in: path
      name: orgName
      schema:
        type: string
        example: org1
      required: true
      description: Organization name
    PackageIDParam:
      in: path
      name: packageID
      schema:
        type: string
        format: uuid
      required: true
      description: Package ID
    OffsetParam:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
      required: false
      description: The number of items to skip before starting to collect the result set
    PackageCategoryListParam:
      in: query
      name: category
      schema:
        type: array
        items:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
      required: false
      description: "Package category:\n  * `1` - AI / Machine learning\n  * `2` - Database\n  * `3` - Integration and delivery\n  * `4` - Monitoring and logging\n  * `5` - Networking\n  * `6` - Security\n  * `7` - Storage\n  * `8` - Streaming and messaging\n"
    CNCFParam:
      in: query
      name: cncf
      schema:
        type: boolean
      required: false
      description: Whether to get only packages published by CNCF projects
    RepoNameParam:
      in: path
      name: repoName
      schema:
        type: string
        example: repoName
      required: true
      description: Repository name
    TSQueryWebParam:
      in: query
      name: ts_query_web
      schema:
        type: string
        example: database
      required: false
      description: Text search query (websearch format)
    OfficialParam:
      in: query
      name: official
      schema:
        type: boolean
      required: false
      description: Whether to get only official repositories
    RepoKindParam:
      in: path
      name: repoKindParam
      schema:
        $ref: '#/components/schemas/RepositoryKindParam'
      required: true
      description: Package kind name
    RepositoryKindsListParam:
      in: query
      name: kind
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RepositoryKind'
      required: false
      description: "Repository kind:\n  * `0` - Helm charts\n  * `1` - Falco rules\n  * `2` - OPA policies\n  * `3` - OLM operators\n  * `4` - Tinkerbell actions\n  * `5` - Krew kubectl plugins\n  * `6` - Helm plugins\n  * `7` - Tekton tasks\n  * `8` - KEDA scalers\n  * `9` - Core DNS plugins\n  * `10` - Keptn integrations\n  * `11` - Tekton pipelines\n  * `12` - Container images\n  * `13` - Kubewarden policies\n  * `14` - Gatekeeper policies\n  * `15` - Kyverno policies\n  * `16` - Knative client plugins\n  * `17` - Backstage plugins\n  * `18` - Argo templates\n  * `19` - KubeArmor templates\n  * `20` - KCL packages\n  * `21` - Headlamp plugins\n  * `22` - Inspektor gadgets\n  * `23` - Tekton stepactions\n  * `24` - Meshery designs\n  * `25` - Opencost plugins\n  * `26` - Radius recipes\n  * `27` - Bootable containers\n  * `28` - Kagent agents\n"
    DeprecatedParam:
      in: query
      name: deprecated
      schema:
        type: boolean
        default: false
      required: false
      description: Whether to include deprecated packages or not
    RepositoriesListParam:
      in: query
      name: repo
      schema:
        type: array
        items:
          type: string
        example:
        - repo1
        - repo2
      required: false
      description: List of repository names
    CapabilitiesListParam:
      in: query
      name: capabilities
      schema:
        type: array
        items:
          type: string
        example:
        - basic install
        - seamless upgrades
        - full lifecycle
        - deep insights
        - auto pilot
      required: false
      description: List of operator capability levels
    VerifiedPublisherParam:
      in: query
      name: verified_publisher
      schema:
        type: boolean
      required: false
      description: Whether to get only verified publisher
    UsersListParam:
      in: query
      name: user
      schema:
        type: array
        items:
          type: string
        example:
        - user1
        - user2
      required: false
      description: List of aliases
  schemas:
    TektonStepActionPackage:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              pipelines.minVersion:
                type: string
                example: 2.0.0
              manifestRaw:
                type: string
                additionalProperties:
                  type: string
                example: 'apiVersion: tekton.dev/v1beta1'
              examples:
                type: object
                additionalProperties: true
              platforms:
                type: array
                items:
                  type: string
                  example: darwin/amd64
    KyvernoPolicy:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          relative_path:
            type: string
            example: /general/allowedrepos
          data:
            type: object
            properties:
              policy:
                type: string
                example: "apiVersion: kyverno.io/v1 kind: ClusterPolicy metadata:\n  name: add-certificates-volume\n  annotations:\n    policies.kyverno.io/title: Add Certificates as a Volume\n    policies.kyverno.io/category: Sample\n    policies.kyverno.io/subject: Pod,Volume"
              kyverno/subject:
                type: string
                example: Pod, Volume
              kyverno/version:
                type: string
                example: 1.5.0
              kyverno/kubernetesVersion:
                type: string
                example: '1.21'
              kyverno/category:
                type: string
                example: OpenShift
    Error:
      type: object
      properties:
        message:
          type: string
          example: error details
    InspektorGadgetPackage:
      $ref: '#/components/schemas/Package'
    KrewPluginsPackage:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              platforms:
                type: array
                items:
                  type: string
                  example: darwin/amd64
              manifestRaw:
                type: string
                additionalProperties:
                  type: string
                example: 'apiVersion: krew.googlecontainertools.github.com/v1alpha2'
    PackageCategoryId:
      type: integer
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      description: "Package category:\n  * `1` - AI / Machine learning\n  * `2` - Database\n  * `3` - Integration and delivery\n  * `4` - Monitoring and logging\n  * `5` - Networking\n  * `6` - Security\n  * `7` - Storage\n  * `8` - Streaming and messaging\n"
    Facets:
      type: object
      required:
      - filter_key
      - title
      - options
      properties:
        filter_key:
          type: string
        title:
          type: string
        options:
          type: array
          items:
            type: object
            required:
            - id
            - name
            - total
            properties:
              id:
                type: string
              name:
                type: string
              total:
                type: integer
              filter_key:
                type: string
      example:
        title: Publisher
        filter_key: publisher
        options:
        - id: f41e7480-8d5c-40d3-9ba6-65ac0da8fc9c
          name: Helm
          total: 292
          filter_key: org
        - id: b771c9a8-0076-444c-ad5e-927abe14173d
          name: Artifact Hub
          total: 1
          filter_key: org
        - id: a70u69a8-0326-324c-fd3e-0iu87e14173d
          name: user1
          total: 3
          filter_key: user
    ContainerImage:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              platforms:
                type: array
                items:
                  type: string
                  example: darwin/amd64
              alternative_locations:
                type: array
                items:
                  type: string
                  example: public.ecr.aws/artifacthub/ah
    HeadlampPluginPackage:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              headlamp/plugin/archive-url:
                type: string
                example: https://headlamp.dev/sample-plugin-url
              headlamp/plugin/distro-compat:
                type: string
                example: in-cluster,web,docker-desktop
              headlamp/plugin/version-compat:
                type: string
                example: '>=1.2.3'
              headlamp/plugin/archive-checksum:
                type: string
                example: sha256:123456...
    PackageBase:
      type: object
      required:
      - package_id
      - name
      - normalized_name
      - stars
      - version
      - ts
      - repository
      properties:
        package_id:
          type: string
          format: uuid
        name:
          type: string
          example: pkg1
        normalized_name:
          type: string
          example: pkg1
        logo_image_id:
          type: string
          example: 12345abcde
        display_name:
          type: string
          example: Package 1
        description:
          type: string
          example: This is a package sample
        version:
          type: string
          example: 1.0.0
        app_version:
          type: string
          example: 0.1.0
        license:
          type: string
          example: MIT
        deprecated:
          type: boolean
          example: false
        signed:
          type: boolean
          example: false
        signatures:
          type: array
          items:
            type: string
            enum:
            - prov
            - cosign
        official:
          type: boolean
        cncf:
          type:
          - boolean
          - 'null'
        ts:
          type: integer
        repository:
          $ref: '#/components/schemas/RepositorySummary'
        security_report_summary:
          type: object
          properties:
            critical:
              type: number
            high:
              type: number
            medium:
              type: number
            low:
              type: number
            unknown:
              type: number
        all_containers_images_whitelisted:
          type: boolean
          example: false
        production_organizations_count:
          type: number
    KeptnIntegrationsPackage:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              keptn/version:
                type: string
                example: 0.1.0
              keptn/kind:
                type: string
                example: service,sli-provider
    OPAPackage:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              policies:
                type: object
                additionalProperties:
                  type: string
                example:
                  policy1: "- macro: text\n  condition: (evt.num < 0)\n"
    TBActionPackage:
      $ref: '#/components/schemas/Package'
    RadiusRecipe:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              recipe:
                type: object
                additionalProperties: true
    ProductionUsageOrganization:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: org1
        display_name:
          type: string
          example: Organization 1
        home_url:
          type: string
          format: uri
          example: http://url
        logo_image_id:
          type: string
          example: 12345abcde
        used_in_production:
          type: boolean
    MesheryDesign:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              design:
                type: string
                additionalProperties:
                  type: string
                example: 'name: sample'
    KubewardenPoliciesPackage:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              kubewarden/resources:
                type: string
                example: Pod
              kubewarden/mutation:
                type: string
                example: 'true'
    BootableContainer:
      $ref: '#/components/schemas/Package'
    ArgoTemplate:
      allOf:
      - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          data:
            type: object
            properties:
              template:
                type: string
                example: "apiVersion: argoproj.io/v1alpha1 kind: WorkflowTemplate metadata:\n  annotations:\n    workflows.argoproj.io/description: This is a basic catalog example that simply\n      prints \"hello argo!\".\n    workflows.argoproj.io/maintainer: '@alexec'\n    workflows.argoproj.io/tags: example\n    workflows.argoproj.io/version: '>= 2.9.0'\n  name: hello-world"
              argo/version:
                type: string
                example: 1.5.0
    RepositoryKindParam:
      type: string
      enum:
      - helm
      - opa
      - falco
      - olm
      - tbaction
      - krew
      - helm-plugin
      - tekton-task
      - keda-scaler
      - coredns
      - keptn
      - tekton-pipeline
      - container
      - kubewarden
      - gatekeeper
      - kyverno
      - knative-client-plugin
      - backstage
      - argo-template
      - kubearmor
      - kcl
      - headlamp
      - inspektor-gadget
