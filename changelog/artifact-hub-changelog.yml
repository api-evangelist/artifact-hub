generated: '2026-09-04'
method: searched
source: >-
  https://github.com/artifacthub/hub/releases and the machine-readable
  `artifacthub.io/changes` annotations on each chart version in
  https://artifacthub.github.io/helm-charts/index.yaml
provider: Artifact Hub
providerId: artifact-hub
description: >-
  Artifact Hub publishes no CHANGELOG.md and its GitHub release bodies are one-line pointers.
  The real, dated, STRUCTURED changelog is the `artifacthub.io/changes` annotation the
  project attaches to every published version of its own Helm chart — each entry is typed
  (added / changed / fixed / removed / security) and rendered at
  https://artifacthub.io/packages/helm/artifact-hub/artifact-hub?modal=changelog. That is
  the same annotation format Artifact Hub asks its publishers to use, so the project eats
  its own dog food.
scheme: semver
current_version: 1.23.0
current_version_date: '2026-07-07'
formats:
- type: structured-annotation
  url: https://artifacthub.io/packages/helm/artifact-hub/artifact-hub?modal=changelog
  machine_readable: true
  note: artifacthub.io/changes annotation, kind + description per entry
- type: release-list
  url: https://github.com/artifacthub/hub/releases
  machine_readable: true
  note: GitHub Releases API; bodies link back to the chart changelog
breaking_change_marker: false
breaking_change_note: >-
  The change kinds are added/changed/fixed/removed/security. There is no `breaking` kind and
  no API-versioning signal, so a consumer cannot tell from the changelog whether an entry
  affects the REST contract. In practice the 1.22.0 -> 1.23.0 diff added and removed zero
  operations.
