specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Artifact Hub
providerId: artifact-hub
publisherName: Artifact Hub
serviceCategory: API
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-09-04'
tags:
  - Cloud Native
  - CNCF
  - Helm Charts
  - Package Registry
  - Discovery
  - Open Source
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Artifact Hub API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
# Corrected 2026-09-04 from the searched pricing finding (plans/artifact-hub-plans-pricing.yml,
# plan_count: 0). The bulk sweep had modelled this as a Usage-Based billed API; it is not.
billingModel:
  pricingCategory: Free
  billingFrequency: None
  billingCurrency: None
  chargeCategories: []
  chargeFrequency: None
  note: >-
    Artifact Hub bills nothing. artifacthub.io is a free CNCF-operated service and the
    software is Apache-2.0. The FinOps framing below is therefore about the INTERNAL cost of
    running a self-hosted instance (hub server, tracker and scanner CronJobs, PostgreSQL),
    not about a supplier invoice — there is no invoice to allocate.
focusColumns:
  ServiceName: Artifact Hub
  ServiceCategory: Developer Tools / API
  ProviderName: Artifact Hub
  PublisherName: Artifact Hub
  InvoiceIssuerName: null
  PricingCategory: Free
  PricingUnit: null
  BillingCurrency: null
  ChargeCategory: null
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Artifact Hub API
    baseURL: https://artifacthub.io/api/v1
    tags:
      - Package Search
      - Registry
      - REST API
      - Cloud Native
    serviceName: Artifact Hub API
    serviceCategory: API
unitEconomics:
  - name: Self-hosted infrastructure cost per 1K API requests
    metric: infrastructure_cost / (api_requests / 1000)
    target: null
    note: Applies only to a self-hosted deployment; the hosted service charges nothing.
  - name: Self-hosted infrastructure cost per tracked repository
    metric: infrastructure_cost / tracked_repositories
    target: null
    note: >-
      The tracker and scanner CronJobs are the dominant cost driver in a self-hosted
      instance, and they scale with repositories tracked rather than with API traffic.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
