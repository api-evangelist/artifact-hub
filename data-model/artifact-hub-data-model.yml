provider: Artifact Hub
providerId: artifact-hub
description: >-
  Entity-relationship graph derived from the Artifact Hub OpenAPI. The model is small and
  regular: a Repository is owned by a User or an Organization, holds Packages, and a Package
  is a typed artifact whose per-kind payload is one of 27 specialised schemas layered on a
  shared PackageBase. Users and Organizations subscribe to Packages and hang Webhooks off
  them.
identifiers:
  style: uuid for internal entities, human names for addressing
  uuid_fields: [package_id, repository_id, webhook_id, notification_id, maintainer_id, optOutID]
  natural_keys:
  - Users are addressed by `alias` (jdoe), not by uuid or email.
  - Organizations are addressed by `orgName`.
  - Repositories are addressed by `name`, unique within an owner.
  - >-
    Packages are addressed EITHER by the triple (repository kind path segment, repository
    name, package name) or by package_id uuid, depending on the operation. Detail and
    summary reads use the triple; values, templates, security reports, stars, views and
    changelog use the uuid. An agent must be able to hold both.
  no_prefixes: >-
    Identifiers carry no type prefix (no pkg_, repo_ style), so a bare uuid in a payload is
    not self-describing.
