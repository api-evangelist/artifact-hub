findings:
- id: repositorykind-enum-lags-its-own-description
  severity: contract-defect
  description: >-
    components.schemas.RepositoryKind declares `enum: [0..27]` but its own description
    documents 29 kinds, ending "* `28` - Kagent agents". Kagent support was added in 1.22.0
    and the description was updated; the enum was not. A strict validator generating a client
    from this spec will reject a legitimate kind 28 repository that the API returns. The
    KagentPackage schema and the /packages/kagent/... operations do exist.
  evidence: openapi/_original/artifact-hub-openapi.yml components.schemas.RepositoryKind
- id: event-kind-enum-is-sparse
  severity: consumer-hazard
  description: >-
    components.schemas.EventKindId is `enum: [0, 1, 2, 4]` — 3 is absent. Client code that
    treats event kinds as a contiguous range will be wrong.
  evidence: openapi/_original/artifact-hub-openapi.yml components.schemas.EventKindId
- id: embedded-not-referenced
  severity: note
  description: >-
    Package embeds a full RepositorySummary rather than a repository_id, so package payloads
    are self-contained but denormalised; a change of repository display name is reflected
    only on the next read of each package.
