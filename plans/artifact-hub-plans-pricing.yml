# 2026-09-04: this file previously contained a bulk-sweep SCAFFOLD (Free/Professional/
# Enterprise tiers with invented 1,000 and 100,000 request quotas and "TBD" prices). None of
# it was ever published by Artifact Hub. It has been replaced with the searched finding.
plan_count: 0
pricing_model: free
description: >-
  Artifact Hub HAS NO PLANS AND NO PRICING. There is no pricing page, no paid tier, no
  enterprise tier and no contact-sales gate: artifacthub.io is a free service operated for
  the community by the CNCF, and the software behind it is Apache-2.0 licensed and
  self-hostable from an official Helm chart. The API is free to call, and the only
  unauthenticated-access constraint is an undocumented rate limit (see
  rate-limits/artifact-hub-rate-limits.yml). This is a true zero, not a gap in our research.
plans: []
evidence:
- fact: No pricing or plans page exists on the site
  url: https://artifacthub.io/
  http_status: 200
  note: >-
    The application is a single-page app whose navigation exposes packages, control panel,
    stats, docs and sign-in. No /pricing route exists; /pricing returns the same SPA shell
    every unmatched path returns.
- fact: Apache-2.0 licensed open source
  url: https://github.com/artifacthub/hub/blob/master/LICENSE
  http_status: 200
- fact: CNCF Incubating project, operated as community infrastructure
  url: https://www.cncf.io/projects/artifact-hub/
  http_status: 200
- fact: Self-hosting is the documented alternative to the hosted service, at no cost
  url: https://artifacthub.io/docs/topics/faq/
  http_status: 200
  note: >-
    "You can deploy your own Artifact Hub instance using the official Helm chart. This is
    the recommended way of deploying your own instance."
cost_to_operate_self_hosted:
  note: >-
    Running your own instance is free of licence cost but not of infrastructure cost — the
    chart deploys the hub server, a tracker and a scanner CronJob and a PostgreSQL database.
    See finops/artifact-hub-finops.yml for the cost-allocation framing.
